name: filmnama-dev

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filmnama}
      POSTGRES_DB: ${POSTGRES_DB:-filmnama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-filmnama}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-filmnama}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set a distinct JWT_SECRET of at least 32 characters in .env}
      JWT_ISSUER: ${JWT_ISSUER:-filmnama-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-filmnama-admin}
      CSRF_SECRET: ${CSRF_SECRET:?set a distinct CSRF_SECRET of at least 32 characters in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL:-http://frontend:3000/api/revalidate}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET:?set a distinct NEXT_REVALIDATE_SECRET of at least 32 characters in .env}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SEED_DEVELOPMENT: "false"
    command: ["sh", "-c", "npm run migrate:deploy && exec node dist/src/main.js"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      FILMNAMA_CONTENT_SOURCE: api
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      BACKEND_API_URL: ${API_URL:-http://backend:4000/api/v1}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET:?set NEXT_REVALIDATE_SECRET in .env}
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
